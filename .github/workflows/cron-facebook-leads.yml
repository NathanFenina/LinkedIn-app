name: Facebook Leads BTP
# Scrape quotidien des groupes Facebook BTP → artisans à appeler.
# Apify gère login + proxies (aucun risque pour le compte FB). Une seule passe
# suffit : l'app scrape tous les groupes actifs, l'IA garde les artisans, et
# remplit la table facebook_leads. Nécessite APIFY_TOKEN côté Vercel.
on:
  schedule:
    # 06:30 UTC ≈ 8h30 heure française — leads frais dès le matin.
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      per_group:
        description: 'Nombre de posts à scanner par groupe (défaut 25)'
        required: false
        default: '25'
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run Facebook leads scrape
        env:
          APP_URL: https://linked-in-app-black.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PER_GROUP: ${{ github.event.inputs.per_group }}
        run: |
          pg="${PER_GROUP:-25}"
          resp=$(curl -fsSL -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/facebook-leads?per_group=$pg")
          echo "$resp"
