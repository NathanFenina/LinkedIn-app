name: Outbound Sequencer Session
# Session d'envoi outbound : UNE session par jour, déclenchée à 14h00 (Paris)
# pile par le cron Vercel (/api/cron/dispatch-outreach) — les crons GitHub ont
# 2-4 h de retard, celui de 12h UTC ci-dessous n'est qu'un filet de sécurité.
# La session reste ouverte jusqu'à 20h Paris : elle envoie 1 message toutes les
# 4-6 min quand une campagne est dans sa fenêtre, et re-vérifie toutes les 5 min
# sinon → CMO démarre à 14h, SEO à 15h, 2e degré + Reprise à 16h, sans retard.
# Repo public → minutes GitHub Actions illimitées.
on:
  schedule:
    - cron: '0 12 * * 1-6'   # filet (retard possible) ; le vrai départ = cron Vercel 12:00 UTC
  workflow_dispatch:
    inputs:
      campaign_id:
        description: 'ID de campagne (vide = toutes les campagnes actives)'
        required: false
        default: ''
concurrency:
  group: outbound-session
  cancel-in-progress: false   # jamais deux sessions en parallèle (pas de double envoi)
jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - name: Run outbound session (14h → 20h Paris)
        env:
          APP_URL: https://linked-in-app-black.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          url="$APP_URL/api/cron/outreach"
          # Fin de session : 20h00 heure de Paris (été comme hiver). Garde-fou : 1h min.
          end=$(TZ=Europe/Paris date -d 'today 20:00' +%s)
          [ $(date -u +%s) -ge $end ] && end=$(( $(date -u +%s) + 3600 ))
          i=0
          while [ $(date -u +%s) -lt $end ]; do
            i=$((i+1))
            resp=$(curl -fsSL -X POST -H "Authorization: Bearer $CRON_SECRET" "$url" || echo '{"sent":0}')
            echo "[$i $(date -u +%H:%M)] $resp"
            sent=$(echo "$resp" | grep -o '"sent":[0-9]*' | head -1 | grep -o '[0-9]*$')
            if [ "${sent:-0}" = "1" ]; then
              sleep $(( ( RANDOM % 121 ) + 240 ))   # 4-6 min entre deux envois
            else
              sleep 300                              # rien à envoyer maintenant → on re-vérifie dans 5 min
            fi
          done
          echo "Session terminée (20h Paris)."
