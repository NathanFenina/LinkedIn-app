name: Outbound Sequencer Session
# Session d'envoi outbound : UNE session par jour, déclenchée à 9h00 (Paris)
# pile par le cron Vercel (/api/cron/dispatch-outreach) — les crons GitHub ont
# 2-4 h de retard, celui de 7h UTC ci-dessous n'est qu'un filet de sécurité.
# La session reste ouverte jusqu'à 18h Paris : elle envoie 1 message toutes les
# 4-6 min quand une campagne est dans sa fenêtre, et re-vérifie toutes les 5 min
# sinon → CMO 9h, SEO 10h, Formation IA 11h, 2e degré 14h, sans retard.
# Repo public → minutes GitHub Actions illimitées.
on:
  schedule:
    - cron: '0 7 * * 1-6'    # filet (retard possible) ; le vrai départ = cron Vercel 07:00 UTC
  workflow_dispatch:
    inputs:
      campaign_id:
        description: 'ID de campagne (vide = toutes les campagnes actives)'
        required: false
        default: ''
concurrency:
  group: outbound-session
  cancel-in-progress: false   # jamais deux sessions en parallèle (pas de double envoi)
jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - name: Run outbound session (9h → 18h Paris)
        env:
          APP_URL: https://linked-in-app-black.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          url="$APP_URL/api/cron/outreach"
          # Fin de session : 18h00 heure de Paris (été comme hiver). Si on démarre
          # après 18h (cron GitHub en retard, session mise en file), on ne fait rien.
          end=$(TZ=Europe/Paris date -d 'today 18:00' +%s)
          if [ $(date -u +%s) -ge $end ]; then echo "Après 18h Paris : pas d'envoi."; exit 0; fi
          i=0
          while [ $(date -u +%s) -lt $end ]; do
            i=$((i+1))
            resp=$(curl -fsSL -X POST -H "Authorization: Bearer $CRON_SECRET" "$url" || echo '{"sent":0}')
            echo "[$i $(date -u +%H:%M)] $resp"
            sent=$(echo "$resp" | grep -o '"sent":[0-9]*' | head -1 | grep -o '[0-9]*$')
            if [ "${sent:-0}" = "1" ]; then
              sleep $(( ( RANDOM % 121 ) + 240 ))   # 4-6 min entre deux envois
            else
              sleep 300                              # rien à envoyer maintenant → on re-vérifie dans 5 min
            fi
          done
          echo "Session terminée (18h Paris)."
