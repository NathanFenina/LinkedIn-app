name: Cross-post detection
# Détecte les nouveaux posts LinkedIn du compte source et prépare les variantes
# (Instagram / Facebook) à valider dans /cross-post. Ne publie jamais rien.
# Toutes les 15 min (les crons GitHub peuvent avoir du retard : c'est un délai
# de détection, pas de publication — la publication reste manuelle).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: cross-post-detect
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect new LinkedIn posts
        env:
          APP_URL: https://linked-in-app-black.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsSL -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/cross-post"
