name: Lead Magnets Comments Session
# Session des campagnes « commentaire seul » (ex : JEV SEO) : répond sous les
# commentaires d'un post, UN PAR UN, espacés de 1 min 50 à 3 min 30, entre 15h et
# 18h Paris, lun-ven. Plafond par jour et par campagne : app_settings.lm_comment_daily_cap.
# Ouverte vers 12h-13h par le cron Vercel /api/cron/dispatch-outreach, puis attend 15h00.
on:
  schedule:
    - cron: '0 11 * * 1-5'   # filet de sécurité ; le vrai départ = cron Vercel
  workflow_dispatch:
concurrency:
  group: lm-comments-session
  cancel-in-progress: false
jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Run comments session (15h00 → 18h Paris)
        env:
          APP_URL: https://linked-in-app-black.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          url="$APP_URL/api/cron/lead-magnets?mode=comments"
          start=$(TZ=Europe/Paris date -d 'today 15:00' +%s)
          end=$(TZ=Europe/Paris date -d 'today 18:00' +%s)
          if [ $(date -u +%s) -ge $end ]; then echo "Après 18h Paris : pas d'envoi."; exit 0; fi
          now=$(date -u +%s)
          if [ $now -lt $start ]; then echo "Attente jusqu'à 15h00 Paris ($(( (start-now)/60 )) min)…"; sleep $(( start - now )); fi
          fails=0
          for i in $(seq 1 200); do
            if [ $(date -u +%s) -ge $end ]; then echo "18h Paris : fin de session."; break; fi
            resp=$(curl -sSL -X POST --max-time 290 -H "Authorization: Bearer $CRON_SECRET" "$url" || echo '{"error":"curl failed"}')
            echo "[$i $(date -u +%H:%M)] $resp"
            if echo "$resp" | grep -q '"error"'; then
              fails=$((fails+1))
              if [ $fails -ge 5 ]; then echo "5 erreurs d'affilée : fin de session."; break; fi
              sleep $(( ( RANDOM % 61 ) + 60 ))
              continue
            fi
            fails=0
            sent=$(echo "$resp" | grep -o '"sent":[0-9]*' | head -1 | grep -o '[0-9]*$')
            if [ "${sent:-0}" = "0" ]; then echo "Session terminée (sent=$sent)."; break; fi
            # 110-210 s entre deux réponses (≈ 70 sur 3 h), jamais en rafale.
            sleep $(( ( RANDOM % 101 ) + 110 ))
          done
