name: Lead Magnets Session
# Session d'envoi des lead-magnets : envoie un DM aux commentateurs d'un post,
# UN PAR UN, espacés d'un délai aléatoire de 2-4 min, entre 15h et 18h Paris — comme une vraie personne.
# Tourne sur le runner GitHub Actions (jusqu'à 6h/job), donc pas de limite
# Vercel 300s. L'app ne fait qu'"envoie le suivant" à chaque appel ; c'est cette
# boucle qui gère l'espacement. Les garde-fous (limits.ts) bloquent au plafond
# LinkedIn. Mettre la campagne en pause (bouton "Arrêter" de l'app) coupe l'envoi
# au tour suivant.
on:
  schedule:
    # Filet de sécurité (retard GitHub possible). Le vrai départ est le cron
    # Vercel /api/cron/dispatch-outreach qui ouvre cette session vers 12h-13h ;
    # la session attend ensuite 15h00 Paris pile avant le premier envoi.
    - cron: '0 11 * * 1-5'
  workflow_dispatch:        # lancé à la demande depuis l'app (bouton "Lancer l'envoi")
    inputs:
      campaign_id:
        description: 'ID de la campagne à envoyer (vide = toutes les campagnes auto_run)'
        required: false
        default: ''
concurrency:
  group: lead-magnets-session
  cancel-in-progress: false
jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # garde-fou (< 6h)
    steps:
      - name: Run lead-magnets session
        env:
          APP_URL: https://linked-in-app-black.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CAMPAIGN_ID: ${{ github.event.inputs.campaign_id }}
        run: |
          # Cible une campagne précise si fournie, sinon toutes les auto_run.
          url="$APP_URL/api/cron/lead-magnets"
          if [ -n "$CAMPAIGN_ID" ]; then
            url="$url?campaign_id=$CAMPAIGN_ID"
          fi

          # Fenêtre d'envoi : 15h00 → 18h00 Paris (été comme hiver), lun-ven.
          start=$(TZ=Europe/Paris date -d 'today 15:00' +%s)
          end=$(TZ=Europe/Paris date -d 'today 18:00' +%s)
          if [ $(date -u +%s) -ge $end ]; then echo "Après 18h Paris : pas d'envoi."; exit 0; fi
          now=$(date -u +%s)
          if [ $now -lt $start ]; then echo "Attente jusqu'à 15h00 Paris ($(( (start-now)/60 )) min)…"; sleep $(( start - now )); fi

          for i in $(seq 1 400); do
            if [ $(date -u +%s) -ge $end ]; then echo "18h Paris : fin de session."; break; fi
            resp=$(curl -fsSL -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$url")
            echo "[$i] $resp"

            sent=$(echo "$resp" | grep -o '"sent":[0-9]*' | head -1 | grep -o '[0-9]*$')

            # Round sans envoi (plus de commentateur, campagne en pause, ou
            # plafond atteint) → fin de session.
            if [ "${sent:-0}" = "0" ]; then
              echo "Session terminée (sent=$sent)."
              break
            fi

            # Espacement aléatoire 120-240s (2-4 min) avant le prochain envoi.
            sleep $(( ( RANDOM % 121 ) + 120 ))
          done
